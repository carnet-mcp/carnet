# The deployment, stated (docs/plans/030-deployment-artifacts.md). Four services:
#
#   db        Postgres 16, bundled behind the `bundled-db` profile — drop the profile
#             from .env and set CARNET_DATABASE_URL to bring your own
#   migrate   `carnet --migrate`, one-shot; everything below waits for it, so
#             an upgrade is `docker compose up -d --build` and the schema moves first
#   api       the door — /mcp, the broker, and the administration surface
#   front     the terminating proxy — the only service that publishes a port
#
# And two more since step 121:
#
#   setup     `carnet --setup`, one-shot, after `migrate` — the tenant, the identity
#             provider row, and a report of what is still missing. It is what used to
#             be three `docker compose exec` commands an operator was told to run, and
#             nothing waits on it: a deployment whose door works must not be held up
#             by a sign-in that is not configured yet
#   idp       the bundled identity provider, behind the `bundled-idp` profile — the
#             same image again, serving /idp/* and nothing else. Absent under
#             CARNET_IDP=external, which is a deployment that brought its own Okta
#
# `migrate`, `api` and `idp` are the same image with different commands, and the
# compose file is where that is inspectable.

name: carnet

services:
  db:
    # Pinned to the multi-arch index digest, like every base image in the Dockerfile
    # (step 055): a tag is a name somebody else can move. The tag stays beside the
    # digest so a reader sees what it was; digest taken 2026-08-30.
    #
    # Two overrides, both step 109, and they answer different environments. The
    # registry prefix is the on-premises one — the same CARNET_BASE_REGISTRY the
    # Dockerfile's bases take, so one line in .env retargets all four images at the
    # company's mirror with the digest kept. The whole reference is the sealed
    # estate's, where the image arrived in a tarball: whether the digest below still
    # names it after `docker load` depends on the image store — `docker save` writes an
    # OCI layout whose index carries it, the containerd store keeps it, the classic
    # store reads the legacy manifest.json beside it and does not — and the far side
    # should not have to know which they run. CARNET_DB_IMAGE=postgres:16 names the
    # loaded tag, which is in the tarball either way (docs/OFFLINE.md). With neither
    # set this is exactly the reference it always was, spelled with Hub's full name.
    image: ${CARNET_DB_IMAGE:-${CARNET_BASE_REGISTRY:-docker.io}/library/postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}
    profiles: ["bundled-db"]
    environment:
      # The superuser stays inside this container: it runs initdb and nothing else.
      # Every DSN below names carnet_app, which initdb/01-app-role.sh creates as an
      # ordinary NOSUPERUSER role — the BYOC shape, because a superuser bypasses
      # row-level security by itself and hides the class of defect 029's testing pass
      # found. The default password is acceptable only because this port is not
      # published; .env.example says to change it anyway.
      POSTGRES_PASSWORD: ${CARNET_DB_PASSWORD:-carnet}
      CARNET_DB_PASSWORD: ${CARNET_DB_PASSWORD:-carnet}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carnet"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
      # Where the base images come from (step 109, decision 5): the Dockerfile's one
      # ARG, fed from .env so an internal-registry policy is a setting rather than an
      # edit. Same value on all three builds — they are one Dockerfile.
      args: &base-registry
        BASE_REGISTRY: ${CARNET_BASE_REGISTRY:-docker.io}
    # The image is a setting (step 110, decision 11), for the team whose policy forbids
    # building: name the published one — `CARNET_API_IMAGE=ghcr.io/carnet-mcp/carnet:0.11.0`
    # in .env — then `docker compose pull` and `up -d` with no `--build`. Unset, this
    # is the name `docker build` and the offline bundle tag the checkout's own build
    # with, and nothing changes. `build:` stays beside it on purpose: compose builds
    # only when the named image is absent, so a pulled image is never rebuilt over.
    image: ${CARNET_API_IMAGE:-carnet-api}
    command: ["carnet", "--migrate"]
    restart: "no"
    environment: &app-env
      # Unset means the bundled database. Managed Postgres (RDS, Cloud SQL, Azure —
      # 16 or later): set it in .env and drop COMPOSE_PROFILES=bundled-db. One DSN for
      # migrate and api, on purpose: UPGRADING's rule is *serve with the role
      # that migrates* — ownership is the row-level-security exemption, and a second
      # DSN would be a second chance to violate it.
      CARNET_DATABASE_URL: ${CARNET_DATABASE_URL:-postgresql://carnet_app:${CARNET_DB_PASSWORD:-carnet}@db:5432/carnet}
      # No default, deliberately: the key is generated once, held in your secret
      # store, and never kept by the platform. See .env.example.
      CARNET_SECRET_KEY: ${CARNET_SECRET_KEY:?generate once with `carnet --generate-key`, keep it in your secret store, set it in .env — losing it is losing every delegated credential}
      # Retired keys, during a rotation. **Without this the rotation procedure in
      # docs/UPGRADING.md is impossible under compose** — you would set the new key,
      # every credential sealed under the old one would stop opening, and
      # `--finish-rotation` would have nothing to re-encrypt from.
      CARNET_SECRET_KEYS_OLD: ${CARNET_SECRET_KEYS_OLD:-}
      # Derived from the domain by default, and overridable for the case the default
      # gets wrong: a trial on shifted ports, or a path prefix that is not `/api`.
      # The in-repo default (http://localhost:8080/api) exists for development and is
      # wrong for every deployment on purpose; this is where the wrongness stops.
      CARNET_PUBLIC_ORIGIN: ${CARNET_PUBLIC_ORIGIN:-https://${CARNET_DOMAIN:?the name this deployment is reached at — `localhost` for a trial}/api}
      CARNET_BOOTSTRAP_ADMIN: ${CARNET_BOOTSTRAP_ADMIN:-}
      # Read by `carnet --setup` only (step 121): the display name of the tenant it
      # creates on a fresh deployment, and the tenant id when it is not set. Nothing
      # else reads it, and changing it afterwards is a rename rather than a setting.
      CARNET_TENANT_NAME: ${CARNET_TENANT_NAME:-}
      # Which provider this deployment signs people in with. The front door reads it to
      # compose /config.json and the CSP; `carnet --setup` reads the same value to
      # decide which `tenant_idps` row to write — which is what keeps the row and the
      # browser pointed at one provider without anybody declaring it twice.
      CARNET_IDP: ${CARNET_IDP:-}
      CARNET_OIDC_ISSUER: ${CARNET_OIDC_ISSUER:-}
      CARNET_OIDC_CLIENT_ID: ${CARNET_OIDC_CLIENT_ID:-}
      # The email domains an external provider may create people for, comma-separated,
      # and the one thing in that row which cannot be derived from the issuer. Empty
      # means people are authenticated and nobody is created automatically — the safe
      # reading, and what --add-idp already says out loud when it is left off.
      CARNET_OIDC_DOMAINS: ${CARNET_OIDC_DOMAINS:-}
      # Step 097: `on` lets every signed-in member administer this tenant — hosts,
      # connectors, vetting, consent flows, groups — with every act still recorded
      # against them. Writes no row; unset it and the gate is back. Off by default.
      CARNET_OPEN_ADMIN: ${CARNET_OPEN_ADMIN:-}

      # --- The knobs, passed through rather than hard-coded ------------------------
      #
      # `environment:` is a closed list: a variable absent here cannot be set from
      # .env at all, it is silently ignored — so every knob the application reads has
      # to be named or it does not exist for a deployment. Several of these carry a
      # comment in `config.py` promising they are "overridable without a deploy",
      # which was not true of this artifact until they were listed here; two more are
      # described there as deployment-level controls. Empty means unset: every reader
      # takes `os.environ.get(...) or <default>`, so a blank is the shipped default.
      # Observability (step 057): the carnet logger's threshold and shape. Both
      # validated at start — a typo refuses with a sentence rather than silently
      # meaning info/text. `json` is one object per line, for a log pipeline.
      CARNET_LOG_LEVEL: ${CARNET_LOG_LEVEL:-}
      CARNET_LOG_FORMAT: ${CARNET_LOG_FORMAT:-}
      # Step 096: one JSON object per brokered call and per refusal, on stdout, for the
      # pipeline that already reads this container's logs. On unless set to `off`.
      CARNET_AUDIT_STDOUT: ${CARNET_AUDIT_STDOUT:-}
      CARNET_RETENTION_DAYS: ${CARNET_RETENTION_DAYS:-}
      CARNET_RETENTION_SWEEP: ${CARNET_RETENTION_SWEEP:-}
      # The MCP door's ceiling (033b): how many calls one token may make in a UTC day.
      # Counted in Postgres, which is what makes it the same ceiling however many API
      # replicas serve.
      CARNET_MCP_CALLS_PER_DAY: ${CARNET_MCP_CALLS_PER_DAY:-}
      # The door's spend ceilings — plan 049 blocker B4. Since 045c a brokered model call
      # through the door spends real money under the connector's own credential, and
      # these are the only dials that cap it. Both ship at 0 (off), and until they were
      # named here a compose deployment had **no way to turn them on** — unbounded spend
      # with the control documented in config.py and unreachable. USD is the dollar
      # ceiling; TOKENS is the token-count net under it.
      CARNET_MCP_USD_PER_DAY: ${CARNET_MCP_USD_PER_DAY:-}
      CARNET_MCP_TOKENS_PER_DAY: ${CARNET_MCP_TOKENS_PER_DAY:-}
      # The prices those ceilings are counted against. A **file path**, not a value, so
      # setting it also means mounting the file — see the `volumes:` note below and
      # .env.example. Unset uses config.py's built-in rate snapshot.
      CARNET_MODEL_RATES: ${CARNET_MODEL_RATES:-}
      # The most an acting-for identity may carry through the door (033c). A real IdP
      # token with group claims runs to several KB; raise it for a provider that emits
      # larger ones.
      CARNET_MCP_MAX_ACTING_FOR_BYTES: ${CARNET_MCP_MAX_ACTING_FOR_BYTES:-}
      # The most one door call may carry as arguments. Bounds what an authenticated
      # caller can write into the audit log, which the ceiling above does not: a
      # denied call spends no budget and still records its arguments.
      CARNET_MCP_MAX_CALL_BYTES: ${CARNET_MCP_MAX_CALL_BYTES:-}
      CARNET_MCP_SESSION_POOL_MAX: ${CARNET_MCP_SESSION_POOL_MAX:-}
      # The OpenAI-compatible surface's own bounds (step 108, decision 4): a model call
      # is not a tool call. The request cap (4 MiB) is under the front door's 12 MiB
      # backstop; the chunk timeout and the wall clock bound a stream that stops
      # producing and one that will not end; THREADS is the API's threadpool, and one
      # open stream holds one thread for the life of the completion — the ceiling on
      # engineers mid-completion per process. Raise it before adding `--workers`.
      CARNET_MODEL_MAX_REQUEST_BYTES: ${CARNET_MODEL_MAX_REQUEST_BYTES:-}
      CARNET_MODEL_CHUNK_TIMEOUT: ${CARNET_MODEL_CHUNK_TIMEOUT:-}
      CARNET_MODEL_MAX_SECONDS: ${CARNET_MODEL_MAX_SECONDS:-}
      CARNET_THREADS: ${CARNET_THREADS:-}
      # Step 083. How long a token minted by an MCP client's OAuth consent lives, in
      # days; 0 for no expiry. The flow issues no refresh token, so an expiry is a
      # re-consent — one click for a person still signed in at their provider.
      CARNET_OAUTH_TOKEN_DAYS: ${CARNET_OAUTH_TOKEN_DAYS:-}
      # The operator's own networks (steps 058, 109): a hostname, or a network in
      # CIDR — `10.0.0.0/8,fd00::/8,sidecar.internal`. A listed name, or a name
      # resolving inside a claimed network, may be loopback or private and still be
      # dialled. Empty (the default) means every connector host must resolve
      # public; link-local (cloud metadata) is refused whatever this says.
      CARNET_EGRESS_INTERNAL_HOSTS: ${CARNET_EGRESS_INTERNAL_HOSTS:-}
      # The customer's own vault (step 070). Set these and a connector's shared
      # credential may be an `op://vault/item/field` reference resolved at call time
      # instead of a variable this deployment holds — the whole of *if you would rather
      # we didn't hold it, we don't have to*.
      #
      # Empty is the honest default: a deployment with no vault has no vault, and a
      # connector that names one gets a refusal saying which two variables are missing.
      # The timeout is a budget for the WHOLE resolution, not per hop.
      CARNET_VAULT_URL: ${CARNET_VAULT_URL:-}
      CARNET_VAULT_TOKEN: ${CARNET_VAULT_TOKEN:-}
      CARNET_VAULT_TIMEOUT_SECONDS: ${CARNET_VAULT_TIMEOUT_SECONDS:-}
      # How long a tool implementation waits for a vendor, in seconds. Made overridable
      # by step 065 for a named reason — a documentation server answered in 1.9s all
      # afternoon and then did not, which the caller sees as `no reply from the server in
      # time` on a call that may well have taken effect — and **never added to this closed
      # list**, so the sentence in `config.py` promising a deployment can raise it was not
      # true of a deployment. Found by step 070's edge pass, running `the_knobs`.
      CARNET_REQUEST_TIMEOUT: ${CARNET_REQUEST_TIMEOUT:-}

      # --- Your network (step 109) ---------------------------------------------------
      #
      # A corporate CA — the one that re-signs intercepted TLS, or issues your internal
      # services' certificates — is a file this container has to be able to read:
      # mount it (the commented volume on `api` below) and name it here. `requests`,
      # which every dial goes through, reads this variable itself; the file REPLACES
      # the bundled public roots rather than adding to them, so concatenate both if
      # anything is dialled direct to the internet. Blank means the bundled roots.
      #
      # SSL_CERT_FILE is deliberately NOT listed, though it is the other spelling. A
      # blank value — which is what this closed list hands the container for every
      # unset variable — makes OpenSSL load a file named "" and leaves Python's
      # default trust store EMPTY (0 roots against 150, checked in this image's base
      # on 2026-09-14). A variable that breaks TLS by being left unset is worse than
      # one that cannot be set.
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
      # The outbound proxy, and setting it is a declaration: the proxy becomes the
      # arbiter of where a dial on the internet lands, and the DNS-rebinding check
      # moves to it — egress.py's docstring has the trade. Your own networks
      # (CARNET_EGRESS_INTERNAL_HOSTS) are dialled direct and keep every check.
      # HTTPS_PROXY, HTTP_PROXY and NO_PROXY are deliberately NOT read: the dial
      # used to half-apply its pin behind an ambient proxy without saying so, and a
      # Docker daemon injects those three into every container. One set without this
      # refuses at start, naming this.
      CARNET_EGRESS_PROXY: ${CARNET_EGRESS_PROXY:-}
    depends_on:
      db:
        condition: service_healthy
        # `required: false` is what lets the bundled-db profile be switched off
        # without editing this file.
        required: false

  # Step 121. What used to be three commands in deploy/README.md that an operator was
  # told to run after `up`: --add-tenant, --add-idp and optionally --seed. The stack
  # coming up was not the install finishing, and nothing on the screen said what was
  # left — which is fine for a platform team with a runbook and fatal for the premise
  # that people install this without an IT department.
  #
  # **Nothing depends on this.** It is advisory, and deliberately so: /api/mcp serves
  # machine tokens that never sign in, so a deployment whose door is working must not
  # be held up because an identity provider is unreachable this minute. A failure here
  # is an `Exited (1)` in `docker compose ps` and a sentence in its logs, not an outage.
  # **`docker compose up -d --wait` reports this service exiting and returns 1**, for a
  # stack that is entirely healthy. Compose only expects a container to finish when
  # something depends on it with `service_completed_successfully` — which `migrate` has
  # and this deliberately does not, because that dependency would also mean a
  # deployment refusing to serve when its identity provider is unreachable for a
  # minute. `docker compose up -d` is the command; if you want `--wait`, name the
  # services that stay up: `docker compose up -d --wait api front`.
  setup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
      args: *base-registry
    image: ${CARNET_API_IMAGE:-carnet-api}
    command: ["carnet", "--setup"]
    restart: "no"
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
      args: *base-registry
    image: ${CARNET_API_IMAGE:-carnet-api}
    # The image's default command, restated so the compose file reads whole. What the
    # flags mean — and why there is no --workers and no --proxy-headers — is argued in
    # the Dockerfile.
    command: ["uvicorn", "carnet.api:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
    environment: *app-env
    volumes:
      - var-data:/var/lib/carnet
      # A custom model-rates file (CARNET_MODEL_RATES) is the one setting whose value
      # is a path rather than a scalar, so reaching it means mounting the file and
      # pointing the variable at where it lands. Uncomment and adjust:
      #   - ./model-rates.json:/etc/carnet/model-rates.json:ro
      # then set CARNET_MODEL_RATES=/etc/carnet/model-rates.json in .env.
      #
      # A corporate CA is the second such setting (step 109). Uncomment and adjust:
      #   - ./corporate-ca.pem:/etc/carnet/ca/corporate-ca.pem:ro
      # then set REQUESTS_CA_BUNDLE=/etc/carnet/ca/corporate-ca.pem in .env.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health/ready, not /health (step 056): liveness proves the process, and a
      # container whose green light means "running" while every request 503s is the
      # defect plan 049 named. Readiness makes one real database round trip, so this
      # goes unhealthy when the database is gone — and `unless-stopped` does not
      # restart on unhealthy, so an outage shows as an unhealthy container rather
      # than a restart storm.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Step 121. The provider this deployment runs itself, for the company that has no
  # identity provider to bring — which, under a premise that says people install this
  # without an IT department, is the ordinary case rather than the trial.
  #
  # It is the API image running `carnet.localidp.service`: the SAME handler
  # `carnet --local` has served since step 016, with two of its three jobs switched off
  # because the front door above already does them. One provider, two front doors —
  # a second implementation of a login page, a PKCE check and a redirect allowlist is
  # the drift that would actually hurt, because nobody re-reads the one that works.
  #
  # **The profile is a second line in .env and therefore a second thing that can be
  # wrong.** `CARNET_IDP` is the declaration a person makes; this profile is what
  # compose needs in order to act on it, and nothing in compose can derive one from the
  # other. So the disagreement is *refused* instead: the front door is handed
  # COMPOSE_PROFILES and will not start if the two say different things. `setup.sh`
  # writes both and never meets that sentence.
  idp:
    profiles: ["bundled-idp"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
      args: *base-registry
    image: ${CARNET_API_IMAGE:-carnet-api}
    command: ["python", "-m", "carnet.localidp.service"]
    environment:
      # The one address this deployment is reached at, from the one place it is said —
      # the same expression `app-env` uses above, because a redirect allowlist that
      # disagreed with the app's own origin is a sign-in that fails at the last hop.
      # The provider drops the path and keeps the origin.
      CARNET_PUBLIC_ORIGIN: ${CARNET_PUBLIC_ORIGIN:-https://${CARNET_DOMAIN:?the name this deployment is reached at — `localhost` for a trial}/api}
      # Prefilled into the first registration form, so the address that becomes the
      # administrator is typed once. It grants nothing here: the appointment is the
      # API's, against this same variable, and only while the tenant holds no roles.
      CARNET_BOOTSTRAP_ADMIN: ${CARNET_BOOTSTRAP_ADMIN:-}
      # `closed` (the default) or `open`. This stack publishes 443, so it is exposed by
      # construction — and on a bundled provider this setting is the WHOLE admission
      # control for the tenant, because the provider is the account authority and its
      # row carries the `"*"` domain wildcard that only it is entitled to. The FIRST
      # account is admitted either way, which is how the deployment gets an
      # administrator; `open` on a public address is a stranger creating an account.
      CARNET_IDP_REGISTRATION: ${CARNET_IDP_REGISTRATION:-}
    volumes:
      # The accounts database, the signing key and the cookie key. **Back this up with
      # the same sentence as the database**: losing it is losing every password, and
      # under closed registration re-creating them is an operator's job. The signing
      # key matters for a smaller reason — it is regenerated if lost, which signs
      # everybody out an hour later when the API's JWKS cache expires.
      - idp-data:/var/lib/carnet-idp
    healthcheck:
      # The JWKS, because that is the one endpoint the API actually depends on: a
      # provider that cannot publish its keys is one whose every token fails
      # verification, which reads as "nobody can sign in" rather than as a sick
      # container.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/idp/v1/keys', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  front:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: front
      args: *base-registry
    # The published pair's other half, `ghcr.io/carnet-mcp/carnet-front`, on the same
    # terms as CARNET_API_IMAGE above. Pin both to the same version: the front door
    # serves the bundle the API of that version expects.
    image: ${CARNET_FRONT_IMAGE:-carnet-front}
    environment:
      CARNET_DOMAIN: ${CARNET_DOMAIN}
      # The identity provider the BROWSER talks to (plan 031). One declaration, and
      # the entrypoint derives both /config.json and the CSP from it, so the two
      # cannot disagree. Must name the same provider `--add-idp` registers with the
      # API. Empty means unconfigured: the stack comes up, /config.json is a real
      # 404, and the sign-in screen says what is missing — day one runs `up` before
      # a provider is decided, so this must not refuse. Half-set IS a refusal.
      CARNET_OIDC_ISSUER: ${CARNET_OIDC_ISSUER:-}
      CARNET_OIDC_CLIENT_ID: ${CARNET_OIDC_CLIENT_ID:-}
      CARNET_OIDC_SCOPES: ${CARNET_OIDC_SCOPES:-}
      # For providers whose token endpoint lives on a second origin (Google:
      # https://oauth2.googleapis.com). Space-separated, added to connect-src and
      # frame-src beside the issuer's own origin.
      CARNET_OIDC_EXTRA_ORIGINS: ${CARNET_OIDC_EXTRA_ORIGINS:-}
      # Where the certificate comes from (step 109): unset or `acme` is today's
      # behaviour; `internal` is Caddy's own CA for a name Let's Encrypt cannot see;
      # `files` serves the pair mounted below, and refuses at start if it is not.
      CARNET_TLS_MODE: ${CARNET_TLS_MODE:-}
      # Which provider browser sign-in uses (step 121): `external` (yours, above) or
      # `bundled` (the `idp` service). Unset means `external` when CARNET_OIDC_* is
      # declared — so a deployment that predates this variable upgrades untouched — and
      # a refusal when it is not, because a stack that comes up with no provider at all
      # is one nobody can sign into.
      CARNET_IDP: ${CARNET_IDP:-}
      # Read here for one purpose: to refuse the disagreement described on the `idp`
      # service. Compose cannot tell a container which profiles it activated, so the
      # declaration is passed in and checked rather than trusted.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    # The only published ports. Overridable for a trial beside other services;
    # ACME's HTTP challenge needs the real 80/443 when CARNET_DOMAIN is a real name.
    ports:
      - "${CARNET_HTTP_PORT:-80}:80"
      - "${CARNET_HTTPS_PORT:-443}:443"
    volumes:
      # Caddy's certificates and state. Losing db-data is losing the deployment;
      # losing these is only re-issuing certificates, but ACME rate limits exist.
      - caddy-data:/data
      - caddy-config:/config
      # Your own certificate (step 109, CARNET_TLS_MODE=files): the chain and the key,
      # PEM, at exactly these two names. Uncomment and adjust:
      #   - ./tls:/etc/carnet/tls:ro
    depends_on:
      # The long form for both, because they cannot be mixed — and the second needs it:
      # `required: false` for the same reason the bundled database has it. The profile
      # is what decides whether the provider exists, and a hard dependency would make an
      # external-provider deployment refuse to start over a service it does not want.
      api:
        condition: service_started
      idp:
        condition: service_started
        required: false
    restart: unless-stopped

volumes:
  db-data:
  var-data:
  caddy-data:
  caddy-config:
  idp-data:
